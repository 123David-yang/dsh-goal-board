name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Host tests
        run: node test/host.test.mjs
      - name: Render tests
        run: node test/render.test.mjs
      - name: Accessibility tests
        run: node test/a11y.test.mjs
      - name: Performance benchmark
        run: node test/perf.test.mjs
      - name: Config robustness
        run: node test/config.test.mjs
      - name: Project segmentation
        run: node test/project.test.mjs
